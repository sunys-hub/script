<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인건비 분석 시스템 발표 대본</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 보기 — 고정 타이머 바 + 구간 칩, 아래로 큐 카드가 시간 순서대로 이어짐 */
:root {
  --bg: #F4F5F7; --card: #FFFFFF; --ink: #15191F; --sub: #586170; --faint: #8A93A1; --line: #E3E6EB;
  --ppt: #D9580A; --ppt-soft: #FDEEE4; --demo: #0F8A70; --demo-soft: #E2F4EF; --qa: #2F5BB7; --qa-soft: #E7EEFB;
  --do: #F6F2E3; --do-ink: #6B5410; --now: #FFB547; --done: #9AA3AF;
  --f-display: "IBM Plex Sans KR", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --f-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111418; --card: #1A1E24; --ink: #ECEFF3; --sub: #A9B1BD; --faint: #7D8694; --line: #2A3038;
  --ppt: #FF8A3D; --ppt-soft: #3A2516; --demo: #3CC2A2; --demo-soft: #15302A; --qa: #7FA6FF; --qa-soft: #1C2740;
  --do: #2E2918; --do-ink: #E9D48C; --now: #FFB547; --done: #5E6672; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111418; --card: #1A1E24; --ink: #ECEFF3; --sub: #A9B1BD; --faint: #7D8694; --line: #2A3038;
  --ppt: #FF8A3D; --ppt-soft: #3A2516; --demo: #3CC2A2; --demo-soft: #15302A; --qa: #7FA6FF; --qa-soft: #1C2740;
  --do: #2E2918; --do-ink: #E9D48C; --now: #FFB547; --done: #5E6672; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: break-word; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 상단 바 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.row1 { display: flex; align-items: center; gap: 10px; }
.clock { font-family: var(--f-mono); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; line-height: 1; }
.clock small { font-size: 14px; color: var(--faint); font-weight: 500; margin-left: 4px; }
.status { flex: 1; min-width: 0; font-size: 13px; color: var(--sub); line-height: 1.35; }
.status b { color: var(--ink); }
.status .late { color: #D23C3C; font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; height: 40px; min-width: 44px; padding: 0 12px;
  font: 600 14px var(--f-body); cursor: pointer; }
.btn.go { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn:focus-visible, .chip:focus-visible, .chk:focus-visible { outline: 3px solid var(--now); outline-offset: 2px; }
.row2 { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.row2::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 6px 12px; font: 600 13px var(--f-body); cursor: pointer; white-space: nowrap;
  background: var(--bg); color: var(--sub); }
.chip .t { font-family: var(--f-mono); font-weight: 500; margin-left: 4px; opacity: .8; }
.chip.ppt { background: var(--ppt-soft); color: var(--ppt); } .chip.demo { background: var(--demo-soft); color: var(--demo); }
.chip.qa { background: var(--qa-soft); color: var(--qa); }
.chip.tool { background: transparent; border: 1px solid var(--line); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; position: relative; }
.progress i { position: absolute; inset: 0 auto 0 0; background: var(--now); width: 0; transition: width .5s linear; }

/* 본문 */
main .wrap { padding-block: 18px 80px; display: flex; flex-direction: column; gap: 14px; }
.intro { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--sub); }
.intro h1 { font: 700 21px/1.3 var(--f-display); color: var(--ink); margin: 0 0 6px; text-wrap: balance; }
.plan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.plan div { border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 12px; line-height: 1.3; }
.plan b { display: block; font: 600 16px var(--f-mono); }
.plan .ppt { background: var(--ppt-soft); color: var(--ppt); } .plan .demo { background: var(--demo-soft); color: var(--demo); } .plan .qa { background: var(--qa-soft); color: var(--qa); }

.sec { display: flex; align-items: baseline; gap: 10px; margin: 14px 2px 0; scroll-margin-top: 130px; }
.sec h2 { margin: 0; font: 700 18px var(--f-display); }
.sec span { font: 500 13px var(--f-mono); color: var(--faint); }
.sec.ppt h2 { color: var(--ppt); } .sec.demo h2 { color: var(--demo); } .sec.qa h2 { color: var(--qa); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; scroll-margin-top: 130px;
  display: flex; flex-direction: column; gap: 10px; transition: opacity .2s; }
.card.now { box-shadow: 0 0 0 3px var(--now); border-color: transparent; }
.card.done { opacity: .5; }
.card.skip { background: transparent; border-style: dashed; }
.head { display: flex; align-items: center; gap: 10px; }
.badge { flex: 0 0 auto; font: 700 13px var(--f-mono); padding: 3px 8px; border-radius: 7px; color: #fff; background: var(--ppt); }
.card.demo .badge { background: var(--demo); } .card.qa .badge { background: var(--qa); }
.card.skip .badge { background: var(--done); }
.ttl { flex: 1; min-width: 0; font: 700 16px/1.35 var(--f-display); }
.when { flex: 0 0 auto; font: 500 12.5px var(--f-mono); color: var(--faint); text-align: right; line-height: 1.25; font-variant-numeric: tabular-nums; }
.when b { display: block; color: var(--sub); font-weight: 600; font-size: 13.5px; }
.chk { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: transparent; color: var(--card); cursor: pointer;
  font: 700 16px var(--f-body); display: grid; place-items: center; }
.card.done .chk { background: var(--done); border-color: var(--done); }
.do { background: var(--do); color: var(--do-ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 500; line-height: 1.5; }
.do b { font-weight: 700; }
.say { font-size: var(--fs); line-height: 1.75; color: var(--ink); }
.say p { margin: 0 0 .55em; } .say p:last-child { margin: 0; }
.say mark { background: transparent; color: inherit; font-weight: 700; box-shadow: inset 0 -0.42em 0 var(--ppt-soft); }
.card.demo .say mark { box-shadow: inset 0 -0.42em 0 var(--demo-soft); } .card.qa .say mark { box-shadow: inset 0 -0.42em 0 var(--qa-soft); }
.tip { font-size: 13.5px; color: var(--sub); border-top: 1px dashed var(--line); padding-top: 8px; }
.tip b { color: var(--ink); }
.list { margin: 0; padding-left: 1.1em; font-size: 14.5px; color: var(--ink); }
.list li { margin: 2px 0; }
.qa-item { border-top: 1px solid var(--line); padding-top: 10px; }
.qa-item:first-of-type { border-top: 0; padding-top: 0; }
.qa-item h3 { margin: 0 0 4px; font: 700 15.5px/1.45 var(--f-display); color: var(--qa); }
.qa-item p { margin: 0; font-size: calc(var(--fs) - 1px); line-height: 1.7; }
.fill { background: var(--do); color: var(--do-ink); border-radius: 5px; padding: 0 5px; font-weight: 700; }
.foot { text-align: center; color: var(--faint); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 420px) { .clock { font-size: 26px; } .plan b { font-size: 14px; } }
</style>

<header class="bar">
  <div class="wrap">
    <div class="row1">
      <div class="clock" id="clock" aria-live="off">0:00<small>/ 15:00</small></div>
      <div class="status" id="status">시작 버튼을 누르면 경과 시간과 지금 할 부분을 따라갑니다.</div>
      <button class="btn go" id="startBtn" type="button">시작</button>
    </div>
    <div class="progress" aria-hidden="true"><i id="prog"></i></div>
    <nav class="row2" id="chips" aria-label="구간 이동"></nav>
  </div>
</header>

<main><div class="wrap" id="main">
  <section class="intro">
    <h1>인건비 분석 시스템 발표 대본</h1>
    전체 15분 · 발표 자료 34장 중 핵심만 말하고, 시연을 가운데에 둡니다. 카드의 <b>노란 상자</b>는 화면에서 할 동작, 굵은 밑줄은 꼭 말할 숫자입니다. 오른쪽 동그라미를 누르면 끝난 카드로 표시됩니다.
    <div class="plan">
      <div class="ppt"><b>3:00</b>발표 ①<br>개요·구성</div>
      <div class="demo"><b>4:45</b>시스템<br>시연</div>
      <div class="ppt"><b>4:30</b>발표 ②<br>과정·효과</div>
      <div class="qa"><b>2:45</b>Q&amp;A</div>
    </div>
  </section>
</div></main>

<script>
/* 대본 데이터: start/dur 은 초 단위 계획 시각 */
var S = [
 { id: "p1", type: "ppt", title: "발표 ① 개요·구성", range: "0:00–3:00", items: [
  { b: "S1", t: "표지", dur: 15, say: ["안녕하세요. <mark>인건비 분석 시스템</mark>을 발표할 인재관리팀 <span class='fill'>[이름]</span>입니다.", "급여·인사 기초자료를 올리면 인건비 현황과 증감 원인, 시나리오 예측, 차년도 예산까지 자동으로 계산해 주는 도구입니다."] },
  { b: "S2", t: "목차", dur: 5, say: ["개요, 결과물 소개와 <mark>시연</mark>, 추진 내용, 기대효과 순서로 말씀드리겠습니다."], tip: "S3(장 구분)은 말없이 넘깁니다." },
  { b: "S4", t: "개발 동기 및 목적", dur: 50, say: [
     "인건비 자료는 <mark>요청하는 사람마다 조건이 다릅니다.</mark> 경영보고용인지 예산용인지에 따라 기준월, 대상 조직, 4대보험·퇴직급여 포함 여부가 달라집니다.",
     "그래서 담당자는 매번 월별 급여대장을 열어 조직과 직급을 붙이고 집계하고, 조직개편이 있으면 과거 자료까지 다시 맞춥니다.",
     "이 과정에서 항목이 빠지거나 기준이 섞이면 요청마다 숫자가 달라질 수 있고, '왜 늘었냐'에 답하려면 분석을 또 해야 했습니다.",
     "그래서 기초자료를 한 곳에 모아 <mark>조건만 고르면 현황부터 예산까지</mark> 자동으로 나오게 만드는 것을 목표로 했습니다."] },
  { b: "S5", t: "필요성", dur: 40, say: [
     "왼쪽이 지금 방식, 오른쪽이 시스템 도입 후입니다. 현황은 조건만 고르면 바로 나오고, 증감 원인은 인원·승진·임금 인상 같은 요인으로 자동 분해됩니다. 자료를 올릴 때는 <mark>20개 규칙</mark>으로 정합성을 점검합니다.",
     "그리고 저희는 <mark>망분리 환경</mark>이라 외부 서비스나 클라우드를 쓸 수 없습니다. 그래서 내부에서 사용할 수 있는 Python과 PC에 있는 브라우저만으로 돌아가게 설계했습니다."] },
  { b: "S6", t: "개발 목표", dur: 30, say: [
     "목표는 네 가지였습니다. <mark>원 단위까지 맞는 정확성</mark>, 조건을 바꾸면 바로 나오는 속도, 사내에서 쓸 수 있는 보안, 기준이 바뀌어도 설정으로 바꾸는 확장성입니다.",
     "개발은 데이터 기반, 분석, 시뮬레이션, 예산·보고 순서로 네 단계를 차례로 완료했습니다."], tip: "S7(장 구분)은 넘깁니다." },
  { b: "S8", t: "전체 구성 → 시연으로 전환", dur: 40, say: [
     "HR 시스템에서 받은 <mark>엑셀 6종</mark>을 자료 관리 화면에 올리면, 자동으로 인식하고 검증해서 계산 엔진에 쌓습니다.",
     "이걸 대시보드, 현황 분석, 시뮬레이션, 예산·보고 메뉴에서 쓰고, 결과는 보고용 PDF와 세부 엑셀로 내려받습니다.",
     "설명보다 <mark>바로 화면으로</mark> 보여드리겠습니다."], do: "<b>전환</b> · 발표 화면을 브라우저(로그인 화면)로 바꿉니다." } ] },

 { id: "d", type: "demo", title: "시스템 시연", range: "3:00–7:45", pre: true, items: [
  { b: "준비", t: "시작 전 확인 (발표 전에)", dur: 0, list: [
     "화면실행.bat 미리 실행 → 로그인 화면 띄워 두기 (아이디·비밀번호 확인)",
     "<b>자료 관리 → '다시 검증'</b>을 미리 한 번 눌러 두기 (안 하면 검증 결과가 '아직 검증하지 않았습니다'로 나옴)",
     "시뮬레이션에서 <b>'2027 운영계획안B' 삭제</b> → '2027 운영계획안A'(기본급 +5%, 사원 10명 채용)만 남았는지 확인",
     "예산/보고에 <b>'2026 인건비 예산'(확정)</b>만 있는지 확인 (리허설 때 만든 B안 예산은 삭제)",
     "조건: 시작월 <b>2026-01</b>, 종료월 <b>2026-10</b>(자료가 10월까지라 12월은 선택 불가), 인건비 정의 <b>경영보고용</b>, 대상 조직 비움, 단위 <b>억원</b> — 대시보드에서 한 번 맞추면 다른 화면도 그대로 따라감",
     "브라우저 확대 110% 안팎 · 메신저·메일 알림 끄기 · 보고용 PDF 한 번 시험",
     "아래 숫자는 보내 준 데이터로 똑같이 실행해서 얻은 값 — 시연 화면도 같은 숫자가 나와야 정상"] },
  { b: "화면 1", t: "로그인", dur: 10, do: "아이디·비밀번호 입력 → <b>로그인</b>", say: [
     "급여 자료를 다루기 때문에 <mark>로그인</mark>부터 합니다. 30분 동안 쓰지 않으면 자동으로 로그아웃됩니다."] },
  { b: "화면 2", t: "홈", dur: 15, do: "홈 화면 그대로 · '자료 적재 현황' 가리키기", say: [
     "홈에서는 할 일을 단계별로 안내하고, 어떤 자료가 몇 개월치 올라와 있는지 보여줍니다. 지금 2025년 1월부터 2026년 10월까지 <mark>22개월</mark>치가 들어 있습니다. 급여 자료는 <mark>더미데이터</mark>를 사용했습니다."] },
  { b: "화면 3", t: "자료 관리 · 검증", dur: 25, do: "<b>자료 관리</b> → 검증 결과의 <b>C10 발령 미반영 36건</b> → '대상 보기'", say: [
     "엑셀을 끌어다 놓으면 파일 이름으로 자료 종류와 월을 알아서 판단하고, 올리면서 <mark>20가지</mark> 정합성을 점검합니다.",
     "예를 들어 발령은 났는데 급여대장 조직이 안 바뀐 경우가 <mark>36건</mark> 있다고 알려주고, 누르면 대상자까지 바로 나옵니다. 잘못 올렸으면 <mark>되돌리기</mark>로 복원됩니다."] },
  { b: "화면 4", t: "대시보드", dur: 30, do: "<b>대시보드</b> → 조건 2026-01 ~ 2026-10 · 경영보고용 · 전사 · <b>억원</b> → <b>분석 실행</b> → 큰 숫자 → '증감 원인' 그래프와 한 줄 해석", say: [
     "올해 1~10월 누적 인건비는 <mark>674.15억</mark>으로, 전년 같은 기간 655.64억보다 <mark>18.50억, 2.8%</mark> 늘었습니다.",
     "왜 늘었는지 요인별로 자동 분해하면 <mark>임금 인상이 20.07억</mark>으로 대부분이고, 인원이 4명가량 줄어 2.31억이 일부 상쇄됐습니다. 그래프 아래 한 문장 해석은 보고서에 그대로 옮겨 쓸 수 있습니다."], tip: "오른쪽 부문·실별 표: WM부문 127.95억(+4.0%)이 가장 큼 → 다음 화면으로 자연스럽게 연결." },
  { b: "화면 5", t: "현황 분석 · WM부문 · 보고용 PDF", dur: 55, do: "<b>현황 분석</b> → 대상 조직 <b>'WM부문 전체'</b> 추가 → <b>분석 실행</b> → 조직별 표에서 자산관리본부 ▸ 고객지원센터 ▸ 펼치기 → <b>보고용 PDF</b> (잠깐 보여주고 닫기)", say: [
     "실제 요청은 보통 '특정 부문, 특정 기간'입니다. 대상 조직에서 <mark>WM부문</mark>을 고르면 모든 숫자가 WM부문 기준으로 바뀝니다. <mark>127.95억, 4.0% 증가</mark>입니다.",
     "전사와 달리 WM부문은 임금 인상 3.76억 외에 <mark>승진·직급 구성 효과가 1.11억</mark>으로 크게 나옵니다. 같은 증가라도 원인이 다르다는 걸 바로 볼 수 있습니다.",
     "조직별 표는 부문 아래 본부, 센터, <mark>파트까지</mark> 펼쳐 볼 수 있고, 상위 금액은 하위를 정확히 더한 값입니다. 자산관리본부가 87.62억으로 WM부문의 68.5%입니다.",
     "이걸 버튼 한 번으로 <mark>A4 한 장 보고서</mark>로 만들고, 세부 자료는 엑셀로 받습니다."], tip: "PDF가 안 열리면: \"사내 정책상 인쇄 창으로 저장하는 방식으로도 동작합니다\" 하고 다음 화면으로." },
  { b: "화면 6", t: "시뮬레이션 · A안 복사해 B안 만들고 비교", dur: 75, do: "<b>시뮬레이션</b> → <b>2027 운영계획안A</b> 선택 → <b>복사</b> → 이름 <b>'2027 운영계획안B'</b> → B의 임금 가정 <b>편집</b>: 인상률 5 → <b>10</b> → 저장 → 채용 가정 <b>편집</b>: 10 → <b>30</b>명 → 저장 → A·B 체크 → <b>비교 실행 (2)</b>", say: [
     "내년 인건비는 가정을 조합한 시나리오로 계산합니다. 임금 인상, 채용, 승진, 퇴직 같은 가정들을 복합적으로 구성해서 사용할 수 있습니다.",
     "이건 제가 미리 만들어 둔 A안입니다. <mark>기본급 5% 인상, 사원 10명 채용</mark>입니다.",
     "실무에서는 '인상률을 더 올리면?', '채용을 늘리면?' 같은 질문이 바로 옵니다. 그래서 A안을 복사해 B안을 만들고, <mark>인상률 10%, 채용 30명</mark>으로 바꿔 보겠습니다.",
     "비교하면 지금 인원·단가를 그대로 두는 기본안이 <mark>862.17억</mark>이고, A안은 <mark>909.35억(+5.5%)</mark>, B안은 <mark>962.61억(+11.6%)</mark>입니다.",
     "B안이 A안보다 <mark>약 53억</mark> 많고, 가정별 영향을 보면 그 차이 대부분이 임금 인상(42.12억 → 85.24억)에서 나옵니다. 엑셀로 했다면 처음부터 다시 계산해야 했을 일이 <mark>1분 안에</mark> 끝납니다."], tip: "편집 창에서는 숫자 칸만 바꾸고 <b>저장</b>. 표시 이름은 비워 두면 '전사 기본급 +10%'로 자동으로 바뀝니다. 단위가 백만원으로 보이면 결과 위 <b>억원</b> 버튼." },
  { b: "화면 7", t: "예산/보고 · B안으로 예산 편성 → 보고서", dur: 50, do: "<b>예산/보고</b> → <b>+ 예산 편성</b> → 이름 <b>'2027 인건비 예산 (B안)'</b>, 연도 2027, 근거 시나리오 <b>2027 운영계획안B</b> → <b>편성</b> → 증감 요인 그래프 → <b>보고용 PDF</b>", say: [
     "방금 만든 B안으로 바로 <mark>차년도 예산을 편성</mark>해 보겠습니다. 이름과 연도, 근거 시나리오만 고르면 됩니다.",
     "2027년 예산은 <mark>962.61억</mark>, 올해 전망 869.41억보다 <mark>93.20억, 10.7%</mark> 늘어납니다. 기본급 10% 인상이 85.24억, 30명 채용이 15.20억이고, 현 인원 유지 시 변화가 7.24억을 상쇄합니다. 조직별 배분도 같이 만들어집니다.",
     "보고용 PDF를 누르면 <mark>팀장님께 올릴 한 장짜리 보고서</mark>가 바로 나옵니다. 확정하면 수정이 잠기고, 실적이 쌓이면 집행률을 추적합니다."], tip: "올해 전망 869.41억 = 1~10월 실적 + 11~12월 현재 단가 추정. 시뮬레이션의 기본안(862.17억, 2027년 현 인원 유지)과 기준이 달라 증가액이 다르게 보입니다. 질문 나오면 이렇게 설명." },
  { b: "화면 8", t: "설정 · 계산 기준", dur: 20, do: "<b>설정</b> → <b>인건비 정의</b> 탭 → <b>급여항목 분류</b> 탭 → <b>계정</b> 탭 (아무것도 저장하지 않기)", say: [
     "마지막으로 계산 기준은 모두 여기서 관리합니다. 경영보고용·예산용처럼 <mark>목적별로 포함 범위</mark>를 체크로 정하고, 4대보험 요율과 퇴직급여 비율도 연도별로 바꿉니다.",
     "급여대장의 <mark>급여항목</mark>이 어디에 들어가는지도 여기서 정하고, 새 항목이 생기면 '미분류'로 경고가 뜹니다. 기준이 바뀌어도 <mark>코드 수정 없이</mark> 화면에서 바꿉니다."] },
  { b: "전환", t: "PPT로 돌아가기", dur: 5, do: "발표 화면을 PPT <b>S9</b>로", say: ["여기까지가 시연입니다. 다시 자료로 돌아가 <mark>어떻게 만들었는지</mark> 말씀드리겠습니다."] } ] },

 { id: "p2", type: "ppt", title: "발표 ② 과정·효과", range: "7:45–12:15", items: [
  { b: "S9–12", t: "진행과정 (빠르게 넘김)", dur: 15, say: ["시작 전에 서비스 개요, 페이지 구조, 화면 기능 정의를 먼저 정리했습니다. 방금 시연으로 보신 내용이라 넘어가겠습니다."], tip: "S10·S11·S12는 한 장씩 2~3초만 보여 주고 넘깁니다." },
  { b: "S13", t: "데이터 구조", dur: 20, say: ["데이터는 HR 엑셀 6종이고, 별도 DB 서버 없이 <mark>파일 하나</mark>에 저장합니다. 회사마다 다른 열 이름, 급여항목 분류, 요율은 설정 파일로 빼서 코드를 고치지 않아도 되게 했습니다."] },
  { b: "S14", t: "AI 개발 프롬프트 (명세서)", dur: 40, say: [
     "AI에게는 이런 <mark>명세서 형태</mark>로 지시했습니다. 목적과 망분리·Python 3.8 같은 제약, 개발 순서를 먼저 주고, 어떤 급여를 넣고 뺄지, 요율은 얼마인지 같은 <mark>업무 기준은 제가 정했습니다.</mark>",
     "핵심은 한 번에 다 시키지 않고, <mark>단계마다 결과를 확인한 뒤</mark> 다음 단계를 지시한 것입니다."] },
  { b: "S15", t: "사용한 프롬프트 ①→⑧", dur: 30, say: [
     "실제 진행은 여덟 단계였습니다. ⑤번처럼 사내 PC에서 오류가 나면 오류 메시지를 그대로 붙여 원인을 찾았고, ⑦번처럼 그래프가 이상해 보이면 어디가 왜 이상한지 말해서 고치게 했습니다.",
     "AI 결과를 그대로 쓰지 않고 <mark>제가 확인하고 고치는 과정</mark>을 반복했습니다."] },
  { b: "S16", t: "시스템 구조", dur: 15, say: ["시스템 구조는 화면, 로컬 서버, 계산 엔진 세 부분으로 나눴고, 계산 엔진도 적재·분석·시뮬레이션·예산·출력별로 <mark>파일을 나눠</mark> 고칠 곳을 바로 찾을 수 있습니다."] },
  { b: "S17", t: "정확성 · 예외 처리 (왜 Python 계산인가)", dur: 35, say: [
     "급여 분석에서는 정확도가 가장 중요합니다. 그래서 <mark>AI는 만드는 데만 쓰고, 숫자 계산은 검증된 Python 코드</mark>가 하도록 했습니다.",
     "Python이라서 믿을 수 있다는 게 아니라, 계산 규칙이 고정돼 있어 같은 자료면 항상 같은 숫자가 나오고, 급여대장의 <mark>지급총액이라는 독립된 기준</mark>과 원 단위로 맞춰 봤기 때문입니다."] },
  { b: "S18", t: "보안 · 사내 환경", dur: 30, say: ["원칙은 '<mark>밖으로 나가지 않고, 아무나 볼 수 없게</mark>'입니다. 인터넷이나 외부 API를 쓰지 않아 인증키가 없고, 이 PC에서만 접속됩니다. 비밀번호는 되돌릴 수 없는 형태로 저장하고, 보고서에는 개인별 급여가 들어가지 않습니다."] },
  { b: "S20", t: "기대효과 — 수치", dur: 30, say: [
     "효과는 측정값과 예상치를 구분했습니다. 재조회 <mark>0.3초</mark>, 적재 시 자동 점검 20개, 대사 오차 0원은 측정한 값입니다.",
     "자료 한 건 작성 <mark>1분 이내</mark>는 기존에 반나절 걸리던 수작업 기준 예상치입니다. 이 수치는 실제 업무에 적용하면서 측정해 갱신하겠습니다."] },
  { b: "S21", t: "바로 쓰기 · 다른 업무로", dur: 25, say: ["<mark>급여 담당자가 바뀌어도</mark> 실행 파일을 더블클릭하고 로그인한 뒤 홈 안내대로 하면 됩니다. 계산 기준이 사람이 아니라 시스템에 남아 있어서, <mark>누가 해도 같은 숫자</mark>가 나옵니다.", "노무비 산정이나 다른 부서 관리처럼 다른 업무에도 <mark>코드 수정 없이 설정만 바꿔</mark> 적용할 수 있습니다."], tip: "S19(장 구분)·S22(장 구분)는 넘깁니다." },
  { b: "S23", t: "팀원 역할", dur: 10, say: ["1인 프로젝트로, 기획과 업무 기준, 검증은 제가 맡고 AI는 설계와 코드 작성을 도왔습니다."], tip: "S24~S31(결과물 예시 이미지)은 시연으로 갈음하고 넘깁니다. <b>시연이 실패했다면</b> 이 이미지로 화면 설명을 대신합니다." },
  { b: "S33", t: "기타 · 앞으로 더할 기능 → 마무리", dur: 20, say: [
     "앞으로는 'WM부문 작년보다 왜 늘었어?'처럼 말로 물으면 조건을 자동으로 잡아 주는 AI 기능을 붙이려 합니다. 이때도 <mark>계산은 검증된 엔진이, AI는 질문 이해와 설명만</mark> 맡깁니다.", "감사합니다."], do: "<b>S34 (Q&amp;A)</b> 화면으로 넘기고 질문 받기" } ] },

 { id: "q", type: "qa", title: "Q&A 예상 질문", range: "12:15–15:00", items: [
  { b: "Q&A", t: "예상 질문과 짧은 답 (각 20초 안쪽)", dur: 165, qa: [
     ["AI가 만든 시스템인데 숫자를 믿을 수 있나요?", "AI는 코드를 만드는 데만 썼고, 계산은 고정된 규칙의 코드가 합니다. 시스템이 계산한 금액을 급여대장 원본 합계와 22개월 동안 비교했는데 1원도 차이가 없었습니다. 그리고 수정할 때마다 미리 만들어 둔 검사 44개를 자동으로 돌려서 다른 부분이 틀어지지 않았는지 확인합니다."],
     ["(꼬리 질문) 자동 테스트 44개는 어떤 건가요?", "정답을 아는 작은 시험 자료를 넣고 결과가 정답과 같은지 자동으로 확인하는 검사입니다. 명령 한 줄이면 1분 안쪽에 모두 돌아갑니다. <b>자료 적재·검증 15개</b>: 원 단위 정확 저장, 두 줄 머리글 읽기, 기준월·필수 열·중복·못 여는 파일 처리, 되돌리기 복원, 심어 둔 오류를 찾는지, 원본 합계 대사. <b>현황 분석 9개</b>: 정의별 합계, 증감 요인 합 = 총증감, 조직 필터·계층 합계, 입사·퇴사 구분, 엑셀·단위. <b>시뮬레이션 9개</b>: 인상·채용·퇴직·승진·복리후생·일회성 계산, 가정별 영향 합 = 기본안 대비 차이. <b>예산·보고 5개</b>: 시뮬레이션과 금액 일치, 확정 후 잠금, 집행률. <b>조직 계층 3개</b>, <b>화면·로그인 3개</b>: 전체 흐름, 5회 실패 잠금·외부 접속 차단, PDF 생성."],
     ["자동 점검 20개는 무엇을 보나요?", "두 단계입니다. <b>① 파일을 올릴 때 10개</b>: 파일을 열 수 있는지, 값 형식·필수 값 누락, 파일명과 기준월이 같은지, 급여유형, 사번·코드 중복, 숫자가 아닌 열, 퇴사일이 입사일보다 빠른지, 발령일과 기준월, 새 급여항목 등록. <b>② 자료끼리 맞춰 보는 10개</b>: 급여대장과 직원마스터 인원, 조직코드·직급코드가 코드표에 있는지, 월별 인원현황과 인원, <b>지급총액 대사</b>, 전월 대비 급변, 미분류 급여항목, 빠진 달, 발령 대상자 미등록, 발령이 급여에 반영됐는지. 오류는 적재를 막고, 경고는 대상자를 보여 줍니다."],
     ["실제 회사 자료에 바로 쓸 수 있나요?", "더미데이터가 실제 급여대장 양식(두 줄 머리글, 급여항목 62개)이라 구조는 같습니다. 열 이름이 다르면 설정 파일에 별칭만 추가하고, 처음 보는 급여항목은 '미분류' 경고가 떠서 설정 화면에서 분류하면 됩니다."],
     ["급여 자료 유출 위험은요?", "외부로 보내는 기능이 없고, 이 PC에서만 접속되며 로그인이 필요합니다. 다만 자료가 든 저장소 파일 자체는 PC 폴더 권한이나 문서보안(DRM)으로 보호해야 하고, 이건 남은 과제로 정리해 두었습니다."],
     ["다른 사람 PC에서도 쓸 수 있나요?", "폴더를 복사하고 처음 한 번 오프라인 설치 파일만 실행하면 됩니다. 계정은 저장소에 함께 있어 옮겨 가고, 설정의 계정 화면에서 동료 계정을 추가할 수 있습니다."],
     ["코드를 직접 설명하거나 고칠 수 있나요?", "기능별로 파일이 나뉘어 있고 계산식은 설명할 수 있습니다. 예를 들어 4대보험 회사부담은 근로자 공제액에 과세총액 곱하기 사업주 요율을 더한 값, 퇴직급여는 정기급여의 12분의 1입니다. 고친 뒤에는 테스트로 확인합니다."],
     ["시뮬레이션 기본안과 예산의 증가액이 왜 다르죠? (B안 +100.44억 vs +93.20억)", "비교 기준이 다릅니다. 시뮬레이션은 '2027년에 지금 인원·단가를 그대로 유지하는 기본안(862.17억)'과 비교하고, 예산은 '올해 전망(1~10월 실적 + 11~12월 추정, 869.41억)'과 비교합니다."],
     ["시뮬레이션 0.8%는 어떻게 확인했나요?", "2025년 12월을 기준으로 '기본급 3.5% 인상'만 넣어 2026년 예산을 만들고, 실제 2026년 1~10월 실적과 비교했습니다. 누적으로 예산보다 0.8% 많았습니다."],
     ["증감 원인은 어떻게 나누나요?", "인원 변화는 인원 차이에 전기 1인당 단가를 곱하고, 승진·직급 구성은 직급 비중이 바뀐 효과, 임금 인상은 남은 단가 효과입니다. 과표산입·4대보험은 각각의 증감이라 다 더하면 총증감과 정확히 같습니다."],
     ["조직개편이 되면요?", "조직코드표만 새로 올리면 부문부터 파트까지 계층을 다시 계산합니다. 과거 자료를 현 조직 기준으로 다시 보고 싶으면 '현 조직 기준 소급'을 켜면 됩니다."],
     ["왜 엑셀이나 BI가 아니라 직접 만들었나요?", "망분리라 외부 BI를 쓸 수 없고, 엑셀은 매번 수작업이라 검증이 어렵습니다. 검증·시나리오·예산까지 한 흐름으로 묶으려면 직접 만드는 게 맞았습니다."],
     ["개발 기간은 얼마나 걸렸나요?", "<span class='fill'>[직접 채우기: 기간]</span> 동안 데이터 기반 → 분석 → 시뮬레이션 → 예산 순서로 단계마다 확인하며 진행했습니다."]] },
  { b: "끝", t: "시간이 모자랄 때 줄이는 순서", dur: 0, list: [
     "1순위: S15(프롬프트 ①→⑧) · S16(구조) · S21(바로 쓰기) 생략 → 약 1분 10초 확보",
     "2순위: 화면 3(자료 관리)·화면 8(설정) 짧게, 화면 5에서 PDF 생략 → 약 40초 (화면 6·7은 이번 시연의 핵심이라 유지)",
     "S17(정확성·Python)과 S14(AI 지시)는 평가 핵심이라 줄이지 않기"] } ] }
];

/* 시각 계산 */
var T = 0;
S.forEach(function (sec) { sec.items.forEach(function (it) { it.start = T; T += it.dur; }); });
var TOTAL = 900;
function fmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

var store = { get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
              set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
var done = store.get("hrcost.script.done", {});
var main = document.getElementById("main"), chips = document.getElementById("chips");
var cards = [];

S.forEach(function (sec) {
  var c = el("button", "chip " + sec.type, sec.title.replace(/ .*/, "") === "Q&A" ? "Q&amp;A" : sec.title.split(" ")[0] + " " + (sec.title.split(" ")[1] || ""));
  c.type = "button"; c.innerHTML = sec.title + '<span class="t">' + sec.range.split("–")[0] + "</span>";
  c.onclick = function () { document.getElementById(sec.id).scrollIntoView({ behavior: "smooth", block: "start" }); };
  chips.appendChild(c);
  var h = el("div", "sec " + sec.type); h.id = sec.id;
  h.appendChild(el("h2", null, sec.title)); h.appendChild(el("span", null, sec.range));
  main.appendChild(h);
  sec.items.forEach(function (it, k) {
    var key = sec.id + k;
    var card = el("article", "card " + sec.type + (it.dur === 0 ? " skip" : ""));
    card.id = "c-" + key;
    var head = el("div", "head");
    head.appendChild(el("span", "badge", it.b));
    head.appendChild(el("div", "ttl", it.t));
    if (it.dur) head.appendChild(el("div", "when", "<b>" + fmt(it.start) + "</b>" + (it.dur >= 60 ? fmt(it.dur) : it.dur + "초")));
    var chk = el("button", "chk", "✓"); chk.type = "button"; chk.setAttribute("aria-label", it.t + " 완료 표시");
    chk.onclick = function () { done[key] = !done[key]; store.set("hrcost.script.done", done); paint(); };
    head.appendChild(chk);
    card.appendChild(head);
    if (it.do) card.appendChild(el("div", "do", "▶ " + it.do));
    if (it.say) { var say = el("div", "say"); it.say.forEach(function (p) { say.appendChild(el("p", null, p)); }); card.appendChild(say); }
    if (it.list) { var ul = el("ul", "list"); it.list.forEach(function (p) { ul.appendChild(el("li", null, p)); }); card.appendChild(ul); }
    if (it.qa) it.qa.forEach(function (q) { var d = el("div", "qa-item"); d.appendChild(el("h3", null, "Q. " + q[0])); d.appendChild(el("p", null, q[1])); card.appendChild(d); });
    if (it.tip) card.appendChild(el("div", "tip", "💡 " + it.tip));
    main.appendChild(card);
    cards.push({ key: key, it: it, card: card });
  });
});
var tools = [["A−", function () { setFs(-1); }], ["A+", function () { setFs(1); }], ["처음부터", function () { reset(); }]];
tools.forEach(function (t) { var b = el("button", "chip tool", t[0]); b.type = "button"; b.onclick = t[1]; chips.appendChild(b); });
main.appendChild(el("p", "foot", "슬라이드 번호(S)는 최종 발표 자료 34장 기준 · 숫자는 더미데이터 기준"));

var fs = store.get("hrcost.script.fs", 18);
function setFs(d) { fs = Math.min(26, Math.max(14, fs + d)); document.documentElement.style.setProperty("--fs", fs + "px"); store.set("hrcost.script.fs", fs); }
setFs(0);

/* 타이머 */
var running = false, base = 0, startedAt = 0, timer = null, lastNow = null, wake = null;
var saved = store.get("hrcost.script.elapsed", 0); base = saved || 0;
function elapsed() { return base + (running ? (Date.now() - startedAt) / 1000 : 0); }
function paint() {
  var e = elapsed();
  document.getElementById("clock").innerHTML = fmt(e) + "<small>/ 15:00</small>";
  document.getElementById("prog").style.width = Math.min(100, e / TOTAL * 100) + "%";
  var now = null;
  cards.forEach(function (c) {
    c.card.classList.toggle("done", !!done[c.key]);
    if (c.it.dur && e >= c.it.start && e < c.it.start + c.it.dur) now = c;
  });
  if (e >= TOTAL) now = null;
  cards.forEach(function (c) { c.card.classList.toggle("now", (running || e > 0) && c === now); });
  var st = document.getElementById("status");
  if (!running && e === 0) st.textContent = "시작 버튼을 누르면 경과 시간과 지금 할 부분을 따라갑니다.";
  else if (now) {
    var left = now.it.start + now.it.dur - e;
    var firstOpen = cards.filter(function (c) { return c.it.dur && !done[c.key]; })[0];
    var late = firstOpen && firstOpen !== now && firstOpen.it.start < now.it.start ? Math.round(e - firstOpen.it.start - firstOpen.it.dur) : 0;
    st.innerHTML = "지금 <b>" + now.it.b + " " + now.it.t + "</b> · 남은 " + fmt(left) + (late > 0 ? ' <span class="late">· ' + fmt(late) + " 늦음</span>" : "");
  } else st.innerHTML = e >= TOTAL ? "<b>15분 종료</b>" : "일시정지";
  if (running && now && now !== lastNow) { now.card.scrollIntoView({ behavior: "smooth", block: "start" }); }
  lastNow = now;
}
function toggle() {
  var b = document.getElementById("startBtn");
  if (running) { base = elapsed(); running = false; clearInterval(timer); b.textContent = "계속"; store.set("hrcost.script.elapsed", base); releaseWake(); }
  else { startedAt = Date.now(); running = true; timer = setInterval(function () { paint(); store.set("hrcost.script.elapsed", elapsed()); }, 1000); b.textContent = "멈춤"; askWake(); }
  paint();
}
function reset() {
  running = false; clearInterval(timer); base = 0; done = {}; store.set("hrcost.script.done", done); store.set("hrcost.script.elapsed", 0);
  document.getElementById("startBtn").textContent = "시작"; releaseWake(); paint(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function askWake() { try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (w) { wake = w; }).catch(function () {}); } catch (e) {} }
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && running) askWake(); });
document.getElementById("startBtn").onclick = toggle;
if (base > 0) document.getElementById("startBtn").textContent = "계속";
paint();
</script>

</html>
